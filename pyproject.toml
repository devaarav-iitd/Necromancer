[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "necromancer"
version = "0.1.0"
description = "Deterministic infrastructure for reviving abandoned Python repositories"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.109.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
